apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hazelcast-discovery
rules:
  - apiGroups: [""]
    resources:
      - endpoints
      - pods
      - services
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hazelcast-discovery
subjects:
  - kind: ServiceAccount
    name: default
    namespace: p1042
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hazelcast-discovery

