apiVersion: v1
kind: Pod
metadata:
  name: migracion-cc
  namespace: kafka
spec:
  nodeName: kairos02-bqfh8-worker-zjvgt
  containers:
  - name: migracion
    image: confluentinc/cp-server:7.6.0
    command: ["/bin/sh", "-c", "sleep infinity"]
    securityContext:
      runAsUser: 0
    volumeMounts:
    - name: disco-viejo
      mountPath: /mnt/viejo
      readOnly: true
    - name: disco-temp
      mountPath: /mnt/temp
  volumes:
  - name: disco-viejo
    persistentVolumeClaim:
      claimName: data0-controlcenter-0
  - name: disco-temp
    persistentVolumeClaim:
      claimName: data0-controlcenter-0-temp
