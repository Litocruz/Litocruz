cat <<EOF > migracion-kafka-1-restore.yaml
apiVersion: v1
kind: Pod
metadata:
  name: migracion-kafka-1-restore
  namespace: kafka
spec:
  containers:
  - name: migracion
    image: confluentinc/cp-server:7.6.0
    command: ["/bin/sh", "-c", "sleep infinity"]
    securityContext:
      runAsUser: 0
    volumeMounts:
    - name: disco-temp
      mountPath: /mnt/temp
      readOnly: true
    - name: disco-final
      mountPath: /mnt/final
  volumes:
  - name: disco-temp
    persistentVolumeClaim:
      claimName: data0-kafka-1-temp
  - name: disco-final
    persistentVolumeClaim:
      claimName: data0-kafka-1
EOF