apiVersion: v1
kind: Pod
metadata:
  name: migracion-kafka-0
  namespace: kafka
spec:
  containers:
  - name: migracion
    # Usamos la imagen de kafka para tener las herramientas adecuadas
    image: confluentinc/cp-server:7.6.0
    command: ["/bin/sleep", "infinity"]
    securityContext:
      runAsUser: 0
    volumeMounts:
    - name: disco-viejo
      mountPath: /mnt/viejo
      readOnly: true
    - name: disco-temp
      mountPath: /mnt/temp
  volumes:
  - name: disco-viejo
    persistentVolumeClaim:
      claimName: data0-kafka-0      # El disco original (thin)
  - name: disco-temp
    persistentVolumeClaim:
      claimName: data0-kafka-0-temp # El disco puente (thin-csi)
