apiVersion: v1
kind: Pod
metadata:
  name: migracion-kafka-1
  namespace: kafka
spec:
  containers:
  - name: migracion
    # REEMPLAZA ESTA IMAGEN POR LA TUYA SI ES NECESARIO
    image: confluentinc/cp-server:7.6.0
    command: ["/bin/sh", "-c", "sleep infinity"]
    securityContext:
      runAsUser: 0
    volumeMounts:
    - name: disco-viejo
      mountPath: /mnt/viejo
      readOnly: true
    - name: disco-temp
      mountPath: /mnt/temp
  volumes:
  - name: disco-viejo
    persistentVolumeClaim:
      claimName: data0-kafka-1
  - name: disco-temp
    persistentVolumeClaim:
      claimName: data0-kafka-1-temp
