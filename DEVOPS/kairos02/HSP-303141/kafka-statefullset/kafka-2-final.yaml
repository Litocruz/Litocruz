cat <<EOF > kafka-2-final.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data0-kafka-2       # Nombre original crítico
  namespace: kafka
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: thin-csi  # Driver nuevo
EOF





apiVersion: v1
kind: Pod
metadata:
  name: migracion-kafka-2-restore
  namespace: kafka
spec:
  containers:
  - name: migracion
    image: confluentinc/cp-server:7.6.0
    command: ["/bin/sh", "-c", "sleep infinity"]
    securityContext:
      runAsUser: 0
    volumeMounts:
    - name: disco-temp
      mountPath: /mnt/temp
      readOnly: true
    - name: disco-final
      mountPath: /mnt/final
  volumes:
  - name: disco-temp
    persistentVolumeClaim:
      claimName: data0-kafka-2-temp
  - name: disco-final
    persistentVolumeClaim:
      claimName: data0-kafka-2